<div class="grid">
  <figure #polaroid class="polaroid">
    <app-morph [persona]="persona()" (crack)="crack()" />
    <img class="caption" src="i-am-jan.svg" alt="I am Jan" />
  </figure>

  <!-- Three beats: the claim, the visitor's question (YOU's own words), the punchline. -->
  <div class="pitch">
    <p class="claim">I build stuff.</p>
    <p class="ask">What do you need?</p>
    <p class="answer">I <span #adapt class="adapt">adapt.</span></p>
  </div>
</div>
