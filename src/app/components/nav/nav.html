<div class="bar">
  <button type="button" class="brand" (click)="toggle()" [attr.aria-expanded]="isOpen()" aria-label="Jan, contact">
    <span class="name">jan</span><span class="dot"></span>
    <svg class="swoosh" viewBox="0 0 100 16" preserveAspectRatio="none" aria-hidden="true">
      <path d="M3 11 C 18 5, 34 13, 52 9 S 84 4, 97 9" pathLength="1" />
    </svg>
  </button>
  <button type="button" class="arrow" (click)="toggle()" [attr.aria-label]="isOpen() ? 'Close contacts' : 'Open contacts'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="square" d="M4 16l8-8 8 8" />
    </svg>
  </button>
</div>

<nav class="links" aria-label="Contact">
  <p class="label mb-2">Say hi</p>
  @for (c of contacts; track c.label) {
    <a [href]="c.href" target="_blank" rel="noopener">{{ c.label }}</a>
  }
  <p class="label mt-6">Frankfurt, DE · {{ year }}</p>
</nav>
