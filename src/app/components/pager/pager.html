<div #viewport class="pager-viewport" tabindex="0" aria-roledescription="carousel" [class.dragging]="dragging()"
  (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)" (pointerup)="onPointerUp($event)"
  (pointercancel)="onPointerUp($event)" (pointerleave)="lean(0)" (click)="onClick($event)" (wheel)="onWheel($event)" (keydown)="onKey($event)"
  [attr.data-prev]="index() > 0 ? '' : null" [attr.data-next]="index() < stops().length - 1 ? '' : null"
  (scroll)="onNativeScroll()" (focusin)="onFocusIn($event)" (dragstart)="$event.preventDefault()">
  <div #track class="pager-track">
    <ng-content />
  </div>
</div>

@if (stops().length > 1) {
  <!-- Just the dots (desktop; phones show the page in the tile's header line instead). Mouse: the
       open tile's edges turn the page (the cursor shows it), and so do drags, the wheel and the
       arrow keys. Touch: you swipe. -->
  <nav class="pager-nav" aria-label="Pages">
    <div class="pager-dots">
      @for (stop of stops(); track $index) {
        <button type="button" [class.on]="$index === index()" [attr.aria-label]="'Page ' + ($index + 1)"
          [attr.aria-current]="$index === index()" (click)="go($index, 0)"></button>
      }
    </div>
  </nav>
}
